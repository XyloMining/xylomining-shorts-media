name: Weekly Shorts build

# Builds the next week of Shorts (script -> narration -> video -> thumbnail), stages approved ones under videos/,
# and commits state/log back to the repo. Scheduling in Metricool is a separate one-message Claude step (see CLAUDE.md).
on:
  schedule:
    - cron: "0 8 * * 5"      # Fridays 08:00 UTC = Friday evening in Sydney
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render 1 test video in a scratch folder, verify it, commit nothing"
        type: boolean
        default: false

concurrency:
  group: shorts-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check FFmpeg (strict)
        run: |
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Cache narration model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Fetch narration model
        run: python -m yt_auto setup
      - name: Configure git
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
      - name: Health check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m yt_auto doctor || true
      - name: Dry run (render + verify one video, commit nothing)
        if: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          python -m yt_auto dry-run --slots 1 --check 2>&1 | tee dryrun.log
      - name: Report dry-run result (annotations + best-effort log commit)
        if: ${{ always() && inputs.dry_run }}
        run: |
          esc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::notice title=dry-run log tail::$(tail -n 40 dryrun.log 2>&1 | cut -c1-300 | esc)"
          echo "::notice title=alerts.log::$(tail -n 30 logs/alerts.log 2>&1 | cut -c1-400 | esc)"
          echo "::notice title=env::python $(python --version 2>&1) | $(ffmpeg -version | head -1) | whoami=$(whoami)"
          mkdir -p ci-logs
          { echo "run: $GITHUB_RUN_ID"; tail -n 150 dryrun.log; } > ci-logs/dryrun.txt
          git add ci-logs/dryrun.txt
          git commit -m "CI: dry-run log" || echo "::warning::nothing to commit"
          out=$(git pull --rebase --autostash origin main 2>&1 && git push origin HEAD:main 2>&1) || echo "::error title=git push failed::$(echo "$out" | cut -c1-300 | esc)"
      - name: Build the week
        if: ${{ !inputs.dry_run }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m yt_auto run
